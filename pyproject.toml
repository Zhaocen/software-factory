[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "software-factory"
version = "0.1.0"
description = "AI Software Factory powered by LangGraph"
requires-python = ">=3.11"
dependencies = [
    # LangGraph & LangChain 核心
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",

    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",

    # 配置管理
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.2",

    # Docker SDK
    "docker>=7.1.0",

    # 工具
    "GitPython>=3.1.43",
    "aiofiles>=24.1.0",
    "jinja2>=3.1.4",

    # 序列化
    "orjson>=3.10.0",

    # 数据库（MySQL）
    "sqlalchemy>=2.0.0",
    "aiomysql>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
]

[project.scripts]
sf-server = "software_factory.api.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/software_factory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
